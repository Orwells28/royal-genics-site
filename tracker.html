<title>Royal Genics — Internal Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<style>
  :root {
    --navy: #0f2a4d;
    --navy-deep: #0a1d38;
    --gold: #c9932e;
    --gold-light: #e0ac4a;
    --ink: #0f2a4d;
    --ink-dim: #5a6b80;
    --paper: #ffffff;
    --paper-alt: #f4f7fb;
    --line: rgba(15, 42, 77, 0.12);
    --radius: 10px;
    --red: #b3402f;
    --amber: #b3792f;
    --green: #2f7d4f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper-alt); color: var(--ink); }
  body { font-family: Georgia, "Times New Roman", serif; font-size: 16px; line-height: 1.6; }
  h1, .headline { font-family: Arial, "Helvetica Neue", sans-serif; font-weight: 800; color: var(--navy); margin: 0; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 32px; }

  header.tnav { background: var(--navy); padding: 22px 0; }
  .tnav .wrap { display: flex; align-items: center; gap: 14px; }
  .tnav .crest {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, var(--navy), var(--navy-deep));
    display: flex; align-items: center; justify-content: center;
    color: var(--gold-light); font-weight: 800; font-size: 0.9rem;
    border: 2px solid var(--gold);
  }
  .tnav .title { color: #fff; font-size: 1.1rem; font-weight: 700; font-family: Georgia, serif; }
  .tnav .sub { color: rgba(255,255,255,0.6); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }

  main { padding: 48px 0 80px; }
  .page-label { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
  h1.page-title { font-size: 1.8rem; margin-top: 10px; }

  .tracker-grid { display: grid; gap: 20px; margin-top: 36px; }
  .track-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 28px; }
  .track-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
  .track-name { font-family: Arial, sans-serif; font-weight: 800; font-size: 1.15rem; color: var(--navy); }
  .track-agency { font-size: 0.82rem; color: var(--ink-dim); margin-top: 2px; }
  .status-pill {
    font-family: Arial, sans-serif; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 5px 14px; border-radius: 999px; white-space: nowrap; color: #fff;
  }
  .status-pill.green { background: var(--green); }
  .status-pill.amber { background: var(--amber); }
  .status-pill.red { background: var(--red); }
  .status-pill.gray { background: var(--ink-dim); }

  .track-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--line); }
  @media (max-width: 640px) { .track-meta { grid-template-columns: 1fr; } }
  .meta-label { font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); }
  .meta-value { font-size: 0.95rem; margin-top: 4px; }
  .deadline-days { font-family: Arial, sans-serif; font-weight: 800; }
  .deadline-days.warn { color: var(--red); }
  .deadline-days.ok { color: var(--green); }

  .load-msg { color: var(--ink-dim); font-size: 0.9rem; margin-top: 30px; }
</style>

<header class="tnav">
  <div class="wrap">
    <div class="crest">RG</div>
    <div>
      <div class="title">Royal Genics</div>
      <div class="sub">Internal Only — Not Public</div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="page-label">Contract Tracker</div>
  <h1 class="page-title">What we're tracking right now.</h1>
  <div id="cards" class="tracker-grid">
    <div class="load-msg">Loading…</div>
  </div>
</main>

<script>
  function parseDeadline(dateStr) {
    if (!dateStr) return null;
    // Accept either a full ISO timestamp (with T/offset) or a bare date (YYYY-MM-DD)
    var target = new Date(/T/.test(dateStr) ? dateStr : dateStr + "T00:00:00");
    return isNaN(target.getTime()) ? null : target;
  }
  function daysUntil(target) {
    if (!target) return null;
    var now = new Date();
    return Math.ceil((target - now) / 86400000);
  }
  function formatDeadline(target) {
    if (!target) return null;
    var opts = { year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" };
    return target.toLocaleString("en-US", opts) + " " + target.toLocaleTimeString("en-US", { timeZoneName: "short" }).split(" ").pop();
  }
  function statusClass(status) {
    var s = (status || "").toLowerCase();
    if (s.indexOf("submitted") > -1 || s.indexOf("won") > -1) return "green";
    if (s.indexOf("draft") > -1 || s.indexOf("progress") > -1 || s.indexOf("review") > -1) return "amber";
    if (s.indexOf("needs info") > -1 || s === "") return "gray";
    return "amber";
  }
  fetch("tracker-data.json?v=" + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(items){
      var container = document.getElementById("cards");
      container.innerHTML = "";
      items.forEach(function(item){
        var target = parseDeadline(item.deadline);
        var days = daysUntil(target);
        var deadlineText = target ? formatDeadline(target) : (item.deadline || "TBD");
        var daysHtml = "";
        if (days !== null) {
          var cls = days <= 5 ? "warn" : "ok";
          daysHtml = '<span class="deadline-days ' + cls + '">' + (days >= 0 ? days + " days left" : "PAST DUE") + '</span>';
        }
        var card = document.createElement("div");
        card.className = "track-card";
        card.innerHTML =
          '<div class="track-head">' +
            '<div><div class="track-name">' + item.name + '</div><div class="track-agency">' + (item.agency || "") + '</div></div>' +
            '<div class="status-pill ' + statusClass(item.status) + '">' + (item.status || "needs info") + '</div>' +
          '</div>' +
          '<div class="track-meta">' +
            '<div><div class="meta-label">Deadline</div><div class="meta-value">' + deadlineText + (daysHtml ? " — " + daysHtml : "") + '</div></div>' +
            '<div><div class="meta-label">Next Step</div><div class="meta-value">' + (item.nextStep || "—") + '</div></div>' +
          '</div>';
        container.appendChild(card);
      });
    })
    .catch(function(err){
      document.getElementById("cards").innerHTML = '<div class="load-msg">Could not load tracker-data.json — ' + err + '</div>';
    });
</script>
